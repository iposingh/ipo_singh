# Continuous integration — no automatic production deploy.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build API
        run: npm run build -w @ipo-singh/api

      - name: Build website
        env:
          IPO_SINGH_SITE_URL: https://www.example-ipo-singh.test
          IPO_SINGH_API_ORIGIN: https://api.example-ipo-singh.test
        run: npm run build -w @ipo-singh/web
